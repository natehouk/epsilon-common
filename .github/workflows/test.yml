name: test
on: [push, pull_request]
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - name: Unit tests
        run: |
          set -o pipefail
          { c++ -std=c++17 -O2 -Wall -Wextra -Werror -o test_common tests/test_common.cpp && ./test_common && c++ -std=c++17 -O2 -Wall -Wextra -Werror -o test_eq tests/test_eq.cpp && ./test_eq && c++ -std=c++17 -O2 -Wall -Wextra -Werror -o test_dsp tests/test_dsp.cpp && ./test_dsp; } 2>&1 | tee out.txt || { sed 's/^/::error::/' out.txt | head -20; exit 1; }
      - name: Each DSP header compiles on its own
        run: |
          echo 'int main() {}' > empty.cpp
          for f in common/*.hpp; do [ "$f" = common/UiKit.hpp ] && continue; c++ -std=c++11 -fsyntax-only -Wall -Wextra -Werror -include "$PWD/$f" empty.cpp || { echo "::error::$f is not self-contained"; exit 1; }; done
      - name: OpenGL headers (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgl1-mesa-dev
      - name: Fetch DPF
        run: git clone --depth 1 --recursive https://github.com/DISTRHO/DPF.git dpf
      - name: UI kit compiles against DPF
        run: |
          set -o pipefail
          c++ -std=c++17 -fsyntax-only -Wall -Wextra -Werror -Itests/ui -Idpf/distrho -Idpf/dgl -DDGL_OPENGL -DHAVE_OPENGL tests/ui/ui_check.cpp 2>&1 | tee out.txt || { grep -m20 -E 'error|warning' out.txt | sed 's/^/::error::/'; exit 1; }
      - name: sync.sh
        run: |
          mkdir -p /tmp/fake/plugins/Demo && git -C /tmp/fake init -q
          tools/sync.sh /tmp/fake
          test -f /tmp/fake/plugins/Demo/common/UiKit.hpp && cat /tmp/fake/plugins/Demo/common/VERSION
  windows:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: sudo apt-get update && sudo apt-get install -y g++-mingw-w64-x86-64
      - name: Headers build for Windows (MinGW)
        run: x86_64-w64-mingw32-g++ -std=c++17 -O2 -Wall -Wextra -Werror -static -o headers.exe tests/headers_win.cpp -lshell32
